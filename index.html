<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>240hzfps | Mis Redes</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* FONDO DE PANTALLA */
      background: url('fondo.png') no-repeat center center/cover fixed;
      padding: 20px;
    }

    .card {
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 35px 25px;
      border-radius: 20px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    h1 {
      color: #ffffff;
      font-size: 22px;
      margin-bottom: 8px;
    }

    p {
      color: #cccccc;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: block;
      padding: 13px;
      background: #ffffff;
      color: #111111;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      border-radius: 12px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: #e6e6e6;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>@240hzfps</h1>
    <p>Mis redes oficiales</p>

    <!-- Pon tus enlaces reales en href="..." -->
    <div class="links">
      <a href="https://twitch.tv/" target="_blank" class="btn">Twitch</a>
      <a href="https://youtube.com/" target="_blank" class="btn">YouTube</a>
      <a href="https://instagram.com/" target="_blank" class="btn">Instagram</a>
      <a href="https://tiktok.com/" target="_blank" class="btn">TikTok</a>
    </div>
  </div>

</body>
</html>
