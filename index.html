<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>240hzfps | Mis Redes</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* FONDO DE PANTALLA - Revisa si subiste fondo.png o fondo.jpg */
      background: url('fondo.png.png') no-repeat center center/cover fixed;
      padding: 20px;
    }

    .card {
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 25px 25px 35px 25px; /* Ajuste ligero de padding superior */
      border-radius: 20px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ESTILO PARA LA IMAGEN DE PERFIL CIRCULAR */
    .profile-img {
      width: 90px;  /* Ancho de la imagen */
      height: 90px; /* Alto de la imagen */
      border-radius: 50%; /* Esto la hace circular */
      object-fit: cover; /* Recorta la imagen para que encaje sin estirarse */
      border: 3px solid #ffffff; /* Borde blanco fino */
      margin-bottom: 15px; /* Espacio con el nombre */
      box-shadow: 0 4px 10px rgba(0,0,0,0.5); /* Sombra suave */
    }

    h1 {
      color: #ffffff;
      font-size: 20px; /* Un poco más pequeño para equilibrar */
      margin-bottom: 6px;
    }

    p {
      color: #cccccc;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%; /* Botones a ancho completo de la tarjeta */
    }

    .btn {
      display: block;
      padding: 13px;
      background: #ffffff;
      color: #111111;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      border-radius: 12px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: #e6e6e6;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- AQUÍ SE AGREGA LA IMAGEN DE PERFIL -->
    <!-- Cambia 'perfil.png' por el nombre exacto de tu archivo si subiste .jpg -->
    <img src="perfil.png" alt="Foto de Perfil" class="profile-img">

    <h1>@240hzfps</h1>
    <p>Mis redes oficiales</p>

    <div class="links">
      <a href="https://twitch.tv/" target="_blank" class="btn">Twitch</a>
      <a href="https://youtube.com/" target="_blank" class="btn">YouTube</a>
      <a href="https://instagram.com/" target="_blank" class="btn">Instagram</a>
      <a href="https://tiktok.com/" target="_blank" class="btn">TikTok</a>
    </div>
  </div>

</body>
</html>
