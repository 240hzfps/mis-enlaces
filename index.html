<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Redes</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Imagen de fondo */
      background: url('fondo.jpg') no-repeat center center/cover fixed;
      padding: 20px;
    }

    .card {
      background: rgba(0, 0, 0, 0.65); /* Fondo oscuro semitransparente */
      backdrop-filter: blur(10px);       /* Efecto borroso elegante */
      -webkit-backdrop-filter: blur(10px);
      padding: 35px 25px;
      border-radius: 20px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .profile-img {
      width: 95px;
      height: 95px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #ffffff;
      margin-bottom: 15px;
    }

    h1 {
      color: #ffffff;
      font-size: 20px;
      margin-bottom: 6px;
    }

    p {
      color: #cccccc;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: block;
      padding: 13px;
      background: rgba(255, 255, 255, 0.9);
      color: #111111;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      border-radius: 12px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Tu foto de perfil -->
    <img src="perfil.jpg" alt="Foto de perfil" class="profile-img">
    
    <!-- Tu nombre o usuario -->
    <h1>@TuUsuario</h1>
    <p>Mis redes sociales y enlaces oficiales</p>

    <!-- Tus botones (cambia las URL por las tuyas) -->
    <div class="links">
      <a href="https://instagram.com/tu_usuario" target="_blank" class="btn">Instagram</a>
      <a href="https://tiktok.com/@tu_usuario" target="_blank" class="btn">TikTok</a>
      <a href="https://youtube.com/@tu_canal" target="_blank" class="btn">YouTube</a>
      <a href="https://wa.me/521XXXXXXXXXX" target="_blank" class="btn">WhatsApp</a>
    </div>
  </div>

</body>
</html>
