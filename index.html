<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>240hzfps | Mis Redes</title>
  <!-- Biblioteca de íconos oficiales -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url('fondo.png.png') no-repeat center center/cover fixed;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Lienzo para los rayos morados animados */
    #lightning-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none; /* Permite hacer clic a través de él */
      z-index: 1;
      mix-blend-mode: screen; /* Fusión perfecta de luz brillante con tu fondo */
    }

    .card {
      position: relative;
      z-index: 2; /* Siempre por encima de los rayos */
      background: rgba(12, 10, 18, 0.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 30px 25px 35px 25px;
      border-radius: 22px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 25px rgba(168, 85, 247, 0.25);
      border: 1px solid rgba(168, 85, 247, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .profile-img {
      width: 95px;
      height: 95px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #a855f7; /* Borde morado neón sutil */
      margin-bottom: 12px;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.6);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .profile-img:hover {
      transform: scale(1.08);
      box-shadow: 0 0 25px rgba(192, 132, 252, 0.9);
    }

    h1 {
      color: #ffffff;
      font-size: 21px;
      margin-bottom: 5px;
      letter-spacing: 0.5px;
      text-shadow: 0 0 8px rgba(168, 85, 247, 0.5);
    }

    p {
      color: #b3b3c2;
      font-size: 14px;
      margin-bottom: 22px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px 18px;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.06);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Twitch: Púrpura */
    .btn.twitch:hover {
      background: #9146FF;
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 6px 20px rgba(145, 70, 255, 0.55);
      border-color: #9146FF;
    }

    /* YouTube: Rojo */
    .btn.youtube:hover {
      background: #FF0000;
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 6px 20px rgba(255, 0, 0, 0.5);
      border-color: #FF0000;
    }

    /* TikTok: Neón cian/magenta */
    .btn.tiktok:hover {
      background: #010101;
      border-color: #25F4EE;
      box-shadow: -3px -3px 12px rgba(37, 244, 238, 0.6), 3px 3px 12px rgba(254, 44, 85, 0.6);
      transform: translateY(-3px) scale(1.02);
      color: #ffffff;
    }

    /* Instagram: Degradado */
    .btn.instagram:hover {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 6px 20px rgba(220, 39, 67, 0.5);
      border-color: transparent;
    }

    /* Discord: Blurple */
    .btn.discord:hover {
      background: #5865F2;
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 6px 20px rgba(88, 101, 242, 0.5);
      border-color: #5865F2;
    }

    .btn:active {
      transform: translateY(0) scale(0.98);
    }
  </style>
</head>
<body>

  <!-- Lienzo de animación de rayos -->
  <canvas id="lightning-canvas"></canvas>

  <div class="card">
    <img src="perfil.png.jpg" alt="Foto de perfil" class="profile-img">

    <h1>@240hzfps</h1>
    <p>Mis redes sociales oficiales</p>

    <div class="links">
      <a href="https://www.twitch.tv/240hzfpss" target="_blank" class="btn twitch">
        <i class="fa-brands fa-twitch"></i> Twitch
      </a>
      
      <a href="https://youtube.com/" target="_blank" class="btn youtube">
        <i class="fa-brands fa-youtube"></i> YouTube
      </a>

      <a href="https://www.tiktok.com/@240hzfps" target="_blank" class="btn tiktok">
        <i class="fa-brands fa-tiktok"></i> TikTok
      </a>

      <a href="https://www.instagram.com/240hz______/?hl=es" target="_blank" class="btn instagram">
        <i class="fa-brands fa-instagram"></i> Instagram
      </a>

      <a href="https://discord.gg/" target="_blank" class="btn discord">
        <i class="fa-brands fa-discord"></i> Discord
      </a>
    </div>
  </div>

  <!-- Script ligero de generación de rayos morados -->
  <script>
    const canvas = document.getElementById('lightning-canvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    let lightnings = [];

    class Lightning {
      constructor(startX, startY, endX, endY) {
        this.startX = startX !== undefined ? startX : Math.random() * width;
        this.startY = startY !== undefined ? startY : 0;
        this.endX = endX !== undefined ? endX : this.startX + (Math.random() - 0.5) * 350;
        this.endY = endY !== undefined ? endY : height * (0.6 + Math.random() * 0.4);
        this.segments = [];
        this.alpha = 1.0;
        this.decay = 0.02 + Math.random() * 0.03;
        this.createSegments(this.startX, this.startY, this.endX, this.endY, 5);
      }

      createSegments(x1, y1, x2, y2, depth) {
        if (depth === 0) {
          this.segments.push({ x1, y1, x2, y2 });
          return;
        }
        const midX = (x1 + x2) / 2 + (Math.random() - 0.5) * (x2 - x1 + 50);
        const midY = (y1 + y2) / 2 + (Math.random() - 0.5) * 40;
        
        this.createSegments(x1, y1, midX, midY, depth - 1);
        this.createSegments(midX, midY, x2, y2, depth - 1);

        // Ramificación lateral ocasional
        if (Math.random() < 0.25 && depth > 2) {
          const branchEndX = midX + (Math.random() - 0.5) * 160;
          const branchEndY = midY + Math.random() * 120;
          this.createSegments(midX, midY, branchEndX, branchEndY, depth - 2);
        }
      }

      draw() {
        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // Capa 1: Resplandor morado exterior
        ctx.strokeStyle = `rgba(168, 85, 247, ${this.alpha * 0.7})`;
        ctx.lineWidth = 4;
        ctx.shadowColor = '#c084fc';
        ctx.shadowBlur = 18;
        ctx.beginPath();
        for (const seg of this.segments) {
          ctx.moveTo(seg.x1, seg.y1);
          ctx.lineTo(seg.x2, seg.y2);
        }
        ctx.stroke();

        // Capa 2: Centro blanco eléctrico
        ctx.strokeStyle = `rgba(255, 255, 255, ${this.alpha * 0.95})`;
        ctx.lineWidth = 1.8;
        ctx.shadowBlur = 0;
        ctx.stroke();

        ctx.restore();
      }

      update() {
        this.alpha -= this.decay;
      }
    }

    // Rayos al mover o hacer clic
    window.addEventListener('pointerdown', (e) => {
      lightnings.push(new Lightning(e.clientX + (Math.random() - 0.5) * 100, 0, e.clientX, e.clientY));
    });

    let frame = 0;
    function animate() {
      ctx.clearRect(0, 0, width, height);

      // Generar rayo espontáneo aleatorio
      frame++;
      if (frame % 28 === 0 || Math.random() < 0.04) {
        lightnings.push(new Lightning());
      }

      for (let i = lightnings.length - 1; i >= 0; i--) {
        lightnings[i].draw();
        lightnings[i].update();
        if (lightnings[i].alpha <= 0) {
          lightnings.splice(i, 1);
        }
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
